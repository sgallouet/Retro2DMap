name: Reference Screenshot

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/reference-screenshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Start Vite
        run: |
          nohup npm run dev -- --host 127.0.0.1 > /tmp/retro-vite.log 2>&1 &
          echo $! > /tmp/retro-vite.pid

      - name: Wait for app
        run: |
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/retro-vite.log
          exit 1

      - name: Capture Reference Map 01
        run: |
          if command -v google-chrome-stable >/dev/null 2>&1; then
            BROWSER="$(command -v google-chrome-stable)"
          elif command -v google-chrome >/dev/null 2>&1; then
            BROWSER="$(command -v google-chrome)"
          elif command -v chromium >/dev/null 2>&1; then
            BROWSER="$(command -v chromium)"
          else
            echo "No supported Chromium browser found on runner."
            exit 1
          fi

          "$BROWSER"             --headless=new             --no-sandbox             --disable-gpu             --hide-scrollbars             --window-size=2200,1400             --force-device-scale-factor=1             --screenshot=reference-map-01.png             http://127.0.0.1:5173/

          test -s reference-map-01.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: reference-map-01
          path: reference-map-01.png
          if-no-files-found: error
          retention-days: 14
